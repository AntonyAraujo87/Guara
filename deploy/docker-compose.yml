services:
  backend:
    build: ../backend
    container_name: controle-financeiro-backend
    restart: always
    # Sem porta publicada: o Caddy alcança o backend pela rede interna do Docker
    # (backend:3001). Publicar no host deixava o app inteiro acessível em HTTP puro.
    expose:
      - "3001"
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - PORT=3001
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    container_name: guara-frontend
    restart: always
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: guara-caddy
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

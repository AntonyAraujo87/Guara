# As imagens são compiladas no GitHub Actions e baixadas prontas.
# Compilar no servidor competia por recursos com o site em produção.
#
# Para publicar uma versão nova:  bash deploy/publicar.sh
# Para compilar localmente (emergência):  docker compose -f docker-compose.local.yml up -d --build

services:
  backend:
    image: ghcr.io/antonyaraujo87/guara-backend:latest
    container_name: controle-financeiro-backend
    restart: always
    # Sem porta publicada: o acesso é só pela rede interna, através do Caddy.
    expose:
      - "3001"
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - PORT=3001
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  frontend:
    image: ghcr.io/antonyaraujo87/guara-frontend:latest
    container_name: guara-frontend
    restart: always
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: guara-caddy
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

name: Publicar imagens

# Compila as imagens aqui, em máquina grande, em vez de no servidor de produção,
# que assim fica livre para atender o site. Ele só baixa o resultado pronto.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/docker-compose.yml'
      - '.github/workflows/publicar.yml'
  workflow_dispatch: {}

env:
  REGISTRO: ghcr.io

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # Trava antes de compilar. Um hook chamado depois de um return derruba o
      # painel inteiro em tempo de execucao e so aparece pra quem esta logado —
      # o build passa numa boa. A regra react-hooks/rules-of-hooks pega isso em
      # segundos; sem rodar o lint, ela nunca era acionada.
      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Conferir o codigo do frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit --fund=false
          npx eslint .

      - name: Montar o nome da imagem
        # O registro do GitHub só aceita nome em minúsculas, e o usuário tem
        # maiúsculas (AntonyAraujo87). Sem converter, o envio falha com
        # "repository name must be lowercase".
        run: |
          DONO=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGEM_BASE=ghcr.io/$DONO/guara" >> "$GITHUB_ENV"
          echo "Imagens: ghcr.io/$DONO/guara-backend e -frontend"

      - name: Entrar no registro do GitHub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar o buildx
        uses: docker/setup-buildx-action@v3

      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGEM_BASE }}-backend:latest
            ${{ env.IMAGEM_BASE }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGEM_BASE }}-frontend:latest
            ${{ env.IMAGEM_BASE }}-frontend:${{ github.sha }}
          # As chaves públicas do Supabase entram na compilação porque o Next
          # as embute no pacote do navegador. São públicas por natureza — a
          # anon key já aparece no HTML de qualquer visitante.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Resumo
        run: |
          {
            echo "### Imagens publicadas 🐺"
            echo ""
            echo '```'
            echo "${{ env.IMAGEM_BASE }}-backend:latest"
            echo "${{ env.IMAGEM_BASE }}-frontend:latest"
            echo '```'
            echo ""
            echo "Para publicar na VM:"
            echo '```bash'
            echo "bash ~/guara/deploy/publicar.sh"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
